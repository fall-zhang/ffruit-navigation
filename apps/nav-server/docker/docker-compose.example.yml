# 该容器使用 72** 端口
name: less-process

services:
  postgres:
    image: postgres:16.2-bookworm # 镜像名称以及版本
    restart: always # 重启 docker 后该容器也重启
    container_name: postgres-nocode # 容器名称
    environment:
      POSTGRES_USER: userName
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: my_database
    # 指定挂载目录
    volumes:
      - ./postgres:/var/lib/postgresql/data
    ports:
      - "7232:5432" # 本地端口号与容器内部端口号

  nginx:
    image: nginx:1.26.1-alpine-otel
    restart: always
    container_name: nginx-nocode
    ports:
      - 7280:80
      - 7243:443
    volumes:
      - ./nginx/html:/usr/share/nginx/html
      - ./nginx/log:/var/log/nginx
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf

  mongodb:
  # This image automatically creates a replica set required for transactions
    image: mongo:7.0.8
    container_name: ffruit-nav-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: userName
      MONGO_INITDB_ROOT_PASSWORD: password123
    ports:
      - 8217:27017
    volumes:
      - ./mongo/log/mongod.log:/var/log/mongodb/mongod.log
      - ./mongo/data:/data/db
      - ./mongo/config:/data/configdb
      # - ./mongo/config/mongod.conf:/etc/mongod.conf
